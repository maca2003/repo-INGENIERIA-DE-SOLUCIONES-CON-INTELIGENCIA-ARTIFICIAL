name: Pruebas del agente

on:
  push:
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar dependencias
        run: python -m pip install -r requirements.txt
      - name: Pruebas automatizadas (modo simulado, sin Ollama)
        run: python -m pytest -v
      - name: Escenarios de decisión (modo simulado)
        run: python src/demo_escenarios.py --simulado
